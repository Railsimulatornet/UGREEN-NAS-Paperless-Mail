# Monitor GitHub Actions, Compose images and scan dependencies. No automatic merge in this repository.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions-patch:
        update-types: [patch]
      actions-minor:
        update-types: [minor]
  - package-ecosystem: docker-compose
    directories:
      - /de/paperless-ngx
      - /en/paperless-ngx
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: pip
    directory: /.github/security
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      scanner-patches:
        update-types: [patch]
